
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kargbo Throne</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial}
h1{color:gold}
.card{background:#222;border:2px solid gold;margin:10px;padding:15px;border-radius:12px}
button{background:gold;color:#000;padding:8px 15px;font-weight:bold;border-radius:5px}
#box{height:200px;background:#111;border:2px solid gold;margin:10px;padding:10px;text-align:left;overflow:auto}
</style>
</head>
<body>
<h1>👑 KARGBO THRONE</h1>
<p style="color:gold">Bo City | 6 Legends Live</p>
<div class="card">Socrates<br><button onclick="openChat('socrates')">Chat</button></div>
<div class="card">Galileo<br><button onclick="openChat('galileo')">Chat</button></div>
<div class="card">Mandela<br><button onclick="openChat('mandela')">Chat</button></div>
<div class="card">Ada<br><button onclick="openChat('ada')">Chat</button></div>
<div class="card">Leonardo<br><button onclick="openChat('leonardo')">Chat</button></div>
<div class="card">Cleopatra<br><button onclick="openChat('cleopatra')">Chat</button></div>
<div id="t"></div>
<script>
let cur="";
function openChat(n){
cur=n;
document.getElementById("t").innerHTML="<h2 style=color:gold>"+n.toUpperCase()+" LIVE</h2><div id=box></div><input id=inp style=width:60%;padding:10px><button onclick=send() style=background:gold;padding:10px>SEND</button>";
add(n+": Ready Kargbo! I am live!");
}
function add(m){
let b=document.getElementById("box");
b.innerHTML+="<p>"+m+"</p>";
b.scrollTop=b.scrollHeight;
}
function send(){
let i=document.getElementById("inp");
if(!i.value)return;
add("<b>You:</b> "+i.value);
let q=i.value;
i.value="";
setTimeout(()=>{add("<b>"+cur+":</b> Kargbo wisdom on '"+q+"' - we rise!");},600);
}
</script>
</body>
</html>
