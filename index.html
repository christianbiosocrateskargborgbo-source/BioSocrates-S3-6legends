


<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000a1e;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:12px}
.cap{font-size:60px;display:inline-block;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.flag{width:95%;max-width:340px;height:70px;border:2px solid gold;margin:10px auto;border-radius:8px;overflow:hidden;box-shadow:0 0 15px gold}
.f1{background:#1EB53A;height:33%}.f2{background:#fff;height:34%}.f3{background:#0072C6;height:33%}
.mol{width:200px;height:200px;margin:15px auto;position:relative;animation:r 4s linear infinite}
@keyframes r{to{transform:rotateY(360deg)}}
.atom{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;animation:c 1.5s ease-in-out infinite alternate}
.a1{left:0;top:30%;background:#222;color:#0ff}.a2{right:0;top:10%;background:#fff;color:#000}.a3{left:35%;top:45%;background:#0a4dff;color:#fff}.a4{right:5%;bottom:15%;background:red;color:#fff}.a5{left:5%;bottom:10%;background:#222;color:#0ff}.a6{right:20%;bottom:0;background:#fff;color:#000}
@keyframes c{to{transform:translate(-12px,8px) scale(1.2);box-shadow:0 0 20px gold}}
.b{background:gold;color:#000;padding:12px 20px;border-radius:20px;font-weight:900;border:0;margin:5px}
.l{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.i{background:rgba(255,255,255,.08);border:1px solid gold;border-radius:10px;padding:8px}
</style></head>
<body>
