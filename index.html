
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioSocrates S3</title>
<style>
body{margin:0;background:#020617;color:#e2e8f0;font-family:Arial}
.hero{background:linear-gradient(135deg,#020617,#1e1b4b);padding:40px 20px;text-align:center;border-bottom:3px solid #38bdf8}
.hero h1{font-size:42px;background:linear-gradient(to right,#38bdf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{border:1px solid #38bdf8;color:#38bdf8;padding:8px 18px;border-radius:20px}
.mol{width:120px;height:120px;border:3px solid #38bdf8;border-radius:50%;margin:25px auto;animation:spin 4s linear infinite;display:flex;align-items:center;justify-content:center;font-size:50px}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}
.btn{background:#38bdf8;color:#020617;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%}
</style>
</head>
<body>
<div class="hero">
<h1>🧬 BioSocrates S3</h1>
<p>C21H23NO5 - AI Drug Discovery</p>
<div class="badge">6 LEGENDS • S3 • AI LAB</div>
<div class="mol">💊</div>
</div>
<div class="grid">
<div class="card">
<h3>🎯 AI Search</h3>
<input id="t" placeholder="EGFR">
<button class="btn" onclick="document.getElementById('r').innerHTML='✅ Analyzing '+document.getElementById('t').value+': 9.2/10 PROMISING!'">RUN AI</button>
<div id="r"></div>
</div>
<div class="card">
<h3>💊 S3 C21H23NO5</h3>
<p>Weight: 369.4 | AI Optimized</p>
<p>6 Legends Active</p>
</div>
</div>
</body>
</html>
