






<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BO-ATOM</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:12px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.capsule{animation:spin 2s linear infinite;font-size:32px}
.atom{width:70px;height:70px;line-height:70px;border-radius:50%;margin:6px;font-weight:bold;font-size:24px;display:inline-block;animation:spin 2s linear infinite}
.box{max-width:400px;margin:12px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid #0f0;padding:12px;border-radius:12px;background:#111}
a{color:#0ff;text-decoration:none}
</style>
</head>
<body>
<h1>🧪 BO-ATOM</h1>
<div id="capsule" class="capsule">💊</div>
<div id="lab"></div>
<div id="msg"></div>

<div class="box">
<div class="card"><h3>H</h3><button onclick="add('H')">ADD H</button></div>
<div class="card"><h3>O</h3><button onclick="add('O')">ADD O</button></div>
<div class="card"><h3>C</h3><button onclick="add('C')">ADD C</button></div>
<div class="card"><h3>N</h3><button onclick="add('N')">ADD N</button></div>
</div>

<button onclick="make()" style="padding:14px 28px;background:#0f0;color:#000;border:none;border-radius:12px;margin:16px;font-size:18px">
MAKE MEDICINE 💊
</button>

<hr style="border:0.5px solid #0f0;margin:24px 0">

<h2>📄 RESEARCH</h2>
<div style="background:#111;padding:12px;border-radius:12px;max-width:400px;margin:0 auto;text-align:left;border:1px solid #333">
<p>🔬 <a href="https://academia.edu" target="_blank">Academia.edu Profile</a></p>
<p>💊 BO-ATOM - Molecular Medicine</p>
<p>🧬 Papers coming soon</p>
</div>

<div style="margin-top:30px;padding:16px;border-top:1px solid #0f0">
<a href="https://github.com/bo-source" target="_blank">💻 github.com/bo-source</a>
<br><br>
<a href="https://github.com/bo-source/bo-source.github.io" style="border:1px solid #0f0;padding:8px 16px;border-radius:8px">⭐ STAR MY CODE</a>
<p style="color:#666;font-size:12px;margin-top:12px">Built with BO-ATOM 🧪</p>
</div>
<script>
let s=[];let map={H:{c:'#0f0'},O:{c:'#f00'},C:{c:'#fff'},N:{c:'#0ff'}};
function render(){let lab=document.getElementById('lab');lab.innerHTML='';s.forEach((a,i)=>{let d=document.createElement('div');d.className='atom';d.style.background=map[a].c;d.style.color=a=='C'?'#000':'#fff';d.innerText=a;d.onclick=()=>{s.splice(i,1);render()};lab.appendChild(d)})}
function add(a){s.push(a);render()}
function make(){if(s.length==0){msg('ADD ATOMS FIRST!');return}let t=s.join('');let r='BO-MIX '+t;let m='🧪 Custom!';if(t.includes('H')&&t.includes('O')){r='WATER';m='💧 Hydration!'}if(t.includes('C')&&t.includes('H')&&t.includes('O')){r='VITAMIN C';m='🍊 Immune!'}if(t.includes('N')&&t.includes('H')){r='AMINO';m='💪 Muscle!'}document.getElementById('capsule').innerText='💊 '+r;msg(m+' CREATED!');s=[];setTimeout(render,800)}
function msg(x){let e=document.getElementById('msg');e.innerText=x;e.style.color='#ff0';setTimeout(()=>e.innerText='',2500)}render();
</script>
</body>
</html>
