<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kargbo</title><style>body{background:#000;color:#fff;text-align:center;font-family:Arial;margin:0}h1{text-shadow:0 0 20px gold}.sub{color:gold}.legends{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px}.card{background:#222;border:2px solid gold;border-radius:15px;padding:15px}.btn{background:gold;color:#000;padding:12px 25px;border-radius:30px;text-decoration:none;font-weight:bold;display:inline-block}</style></head><body><h1>👑 KARGBO 10 - ONE THRONE</h1><div class="sub">Christian BioSocrates Kargbo</div><div class="legends"><div class="card"><h2>Socrates</h2><button onclick="go('socrates')">Chat</button></div><div class="card"><h2>Galileo</h2><button onclick="go('galileo')">Chat</button></div><div class="card"><h2>Mandela</h2><button onclick="go('mandela')">Chat</button></div><div class="card"><h2>Ada</h2><button onclick="go('ada')">Chat</button></div><div class="card"><h2>Leonardo</h2><button onclick="go('leonardo')">Chat</button></div><div class="card"><h2>Cleopatra</h2><button onclick="go('cleopatra')">Chat</button></div></div><div id="throne"></div><script>let cur='socrates';function go(n){cur=n;document.getElementById('throne').innerHTML='<h2 style=color:gold>'+n.toUpperCase()+' LIVE! 👑</h2><div id=m style="height:200px;background:#111;border:2px solid gold;overflow:auto;padding:10px;margin:10px;text-align:left"></div><input id=i style="padding:10px;width:60%" placeholder="Ask '+n+'"><button onclick=s() style="background:gold;padding:10px">SEND</button>';add(n+': Ask me anything!')}function add(x){let m=document.getElementById('m');m.innerHTML+='<p>'+x+'</p>';m.scrollTop=m.scrollHeight}function s(){let i=document.getElementById('i');let v=i.value;if(!v)return;add('<b>You:</b> '+v);i.value='';setTimeout(()=>add('<b>'+cur+':</b> Wisdom on '+v),600)}</script></body></html>
