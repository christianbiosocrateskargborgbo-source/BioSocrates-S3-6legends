





<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{background:#000;color:#0f0;font-family:monospace;text-align:center;margin:0;padding:10px}
.atom{display:inline-block;width:60px;height:60px;line-height:60px;border-radius:50%;margin:5px;font-weight:bold;font-size:20px;cursor:pointer;transition:.2s}
.l{max-width:400px;margin:10px auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.i{border:1px solid #0f0;padding:10px;border-radius:10px;background:#111}
</style></head><body>
<h2>💊 BioSocrates S3 🇸🇱</h2>
<p>SIERRA LEONE • Bo City • EGFR 9.2</p>
<audio id="boom" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3" preload="auto"></audio>
<div id="atoms"><span class="atom" style="background:#ff4444">O</span><span class="atom" style="background:#4444ff">N</span><span class="atom" style="background:#888">C</span><span class="atom" style="background:#fff;color:#000">H</span></div>
<p>⚛️ TAP ATOMS FOR BOOM! 🔊</p>
<div class="l"><div class="i">🧬<br>LEGEND 1</div><div class="i">🛡️<br>LEGEND 2</div><div class="i">⚛️<br>LEGEND 3</div><div class="i">🧪<br>LEGEND 4</div><div class="i">🧠<br>LEGEND 5</div><div class="i">🎯<br>LEGEND 6</div></div>
<script>
let b=document.getElementById('boom');b.volume=1.0;let ok=false;
function unlock(){if(!ok){b.play().then(()=>{b.pause();b.currentTime=0;ok=true}).catch(()=>{})}}
document.body.addEventListener('touchstart',unlock,{once:true});
document.body.addEventListener('click',unlock,{once:true});
document.querySelectorAll('.atom').forEach(a=>{a.onclick=()=>{unlock();b.currentTime=0;b.play().catch(()=>{});a.style.transform='scale(1.9)';setTimeout(()=>a.style.transform='',250)}});
</script></body></html>
