
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BO-ATOM</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:12px}

.capsule{animation:spin 2s linear infinite;font-size:32px}
.atom{width:70px;height:70px;line-height:70px;border-radius:50%;margin:6px;font-weight:bold;font-size:24px;display:inline-block;animation:spin 2s linear infinite}
.box{max-width:400px;margin:12px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid #0f0;padding:12px;border-radius:12px;background:#111}
a{color:#0ff;text-decoration:none}
</style>
</head>

<div class="card"><h3>C</h3><button onclick="add('C')">ADD C</button></div>
<div class="card"><h3>N</h3><button onclick="add('N')">ADD N</button></div>
</div>
