











<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:radial-gradient(#001845,#000a1e);color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:15px;overflow-x:hidden}
.cap{font-size:60px;display:inline-block;animation:spin 2s linear infinite, glow 1s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotateY(360deg) rotateZ(360deg)}}
@keyframes glow{from{filter:drop-shadow(0 0 5px gold)}to{filter:drop-shadow(0 0 20px gold)}}
.flag{width:90%;max-width:350px;height:75px;border:1.5px solid gold;border-radius:8px;margin:12px auto;overflow:hidden;box-shadow:0 0 20px gold;animation:wave 2s ease-in-out infinite}
.g{background:#1eb53a;height:33.3%}.w{background:#fff;height:33.3%}.bl{background:#0072c6;height:33.3%}
@keyframes wave{0%,100%{transform:perspective(400px) rotateX(5deg)}50%{transform:perspective(400px) rotateX(-5deg) scale(1.02)}}
.b{background:linear-gradient(gold,#ffcc00);color:#000;border:0;padding:12px 25px;border-radius:25px;font-weight:900;font-size:16px;box-shadow:0 0 15px gold}
.l{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.i{background:linear-gradient(#0d1b4a,#102a6d);border:1px solid gold;border-radius:10px;padding:10px;font-size:12px;animation:pop .5s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.mol{width:180px;height:180px;margin:30px auto;position:relative;transform-style:preserve-3d;animation:rot 3s linear infinite}
.atom{position:absolute;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;left:71px;top:71px;box-shadow:0 0 10px #fff;animation:collide 1.5s ease-in-out infinite alternate}
@keyframes rot{to{transform:rotateY(360deg) rotateX(360deg)}}
@keyframes collide{0%{transform:translateZ(70px) scale(1)}50%{transform:translateZ(20px) scale(1.3)}100%{transform:translateZ(70px) scale(1)}}
</style></head><body>
<div class="cap">💊</div>
