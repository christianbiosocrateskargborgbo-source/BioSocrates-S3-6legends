<!doctype html>
<html>
<head>
<title>BioSocrates S3 - 6 Legends 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0a0f2c;color:#fff;text-align:center;font-family:Arial;margin:0;padding:15px}
.capsule{width:90px;height:90px;background:gold;border-radius:50%;margin:15px auto;font-size:50px;line-height:90px;animation:spin 2s linear infinite}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.btn{padding:12px 25px;background:gold;color:#000;border:0;border-radius:30px;font-weight:bold;margin:10px}
.legends{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0}
.legend{background:#1a2a5a;border:1px solid gold;border-radius:15px;padding:10px}
.legend b{color:gold}
.mol{width:200px;height:200px;margin:20px auto;position:relative;transform-style:preserve-3d;animation:mrot 8s linear infinite}
@keyframes mrot{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}}
.atom{position:absolute;width:18px;height:18px;border-radius:50%;left:90px;top:90px}
</style>
</head>

</div>
